<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; background: #F7F2E9; color: #17130F; font-family: "DM Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  a { color: #17130F; text-decoration: none; }
  a:hover { color: #A2543A; }
  img { display: block; }
  ::selection { background: #E3D3B4; }
</style>
</helmet>
<div style="background:#F7F2E9">
  <div style="background:#17130F;color:#EDE3D2;font-size:11px;letter-spacing:.22em;text-transform:uppercase;padding:11px 20px;text-align:center">Complimentary shipping across India · Blessed Kits dispatched within 48 hours</div>
  <header data-nav style="background:rgba(247,242,233,.9);backdrop-filter:blur(14px);border-bottom:1px solid rgba(23,19,15,.09);transition:background .35s ease,box-shadow .35s ease">
    <div data-navinner style="max-width:1400px;margin:0 auto;padding:22px clamp(20px,4vw,56px);display:flex;align-items:center;flex-wrap:wrap;row-gap:14px;gap:clamp(16px,4vw,48px);transition:padding .35s ease">
      <a href="IVA%20Essentials.dc.html" style="display:flex;flex-direction:column;gap:3px;flex:none">
        <span style="font-family:'Cormorant Garamond',serif;font-size:clamp(19px,2.2vw,25px);letter-spacing:.3em;font-weight:500;line-height:1">IVA</span>
        <span style="font-size:8.5px;letter-spacing:.42em;color:#8A7B6B;text-transform:uppercase">Essentials</span>
      </a>
      <nav style="flex:1 1 300px;min-width:0;display:flex;flex-wrap:wrap;row-gap:10px;gap:clamp(16px,2.4vw,36px);align-items:center;justify-content:center">
        <a data-navlink="shop" href="Shop.dc.html" style="font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;padding-bottom:3px;border-bottom:1px solid transparent;transition:border-color .3s,color .3s" style-hover="border-bottom:1px solid #A2543A;color:#A2543A">Shop</a>
        <a data-navlink="blessed" href="BlessedKit.dc.html" style="font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;padding-bottom:3px;border-bottom:1px solid transparent;transition:border-color .3s,color .3s" style-hover="border-bottom:1px solid #A2543A;color:#A2543A">Blessed Kit</a>
        <a data-navlink="yatra" href="YatraKit.dc.html" style="font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;padding-bottom:3px;border-bottom:1px solid transparent;transition:border-color .3s,color .3s" style-hover="border-bottom:1px solid #A2543A;color:#A2543A">Yatra Kit</a>
        <a data-navlink="story" href="OurStory.dc.html" style="font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;padding-bottom:3px;border-bottom:1px solid transparent;transition:border-color .3s,color .3s" style-hover="border-bottom:1px solid #A2543A;color:#A2543A">Our Story</a>
        <a data-navlink="contact" href="Contact.dc.html" style="font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;padding-bottom:3px;border-bottom:1px solid transparent;transition:border-color .3s,color .3s" style-hover="border-bottom:1px solid #A2543A;color:#A2543A">Contact</a>
      </nav>
      <div style="flex:none;display:flex;gap:clamp(14px,2vw,26px);align-items:center;white-space:nowrap">
        <a href="Shop.dc.html" style="font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#6B5F52" style-hover="color:#A2543A">Search</a>
        <a href="https://ivaessentials.com/customer_authentication/redirect?locale=en&amp;region_country=IN" style="font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#6B5F52" style-hover="color:#A2543A">Account</a>
        <a href="Cart.dc.html" style="font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;border:1px solid rgba(23,19,15,.2);padding:9px 16px;border-radius:2px;transition:background .3s,color .3s,border-color .3s" style-hover="background:#17130F;color:#F7F2E9;border-color:#17130F">Cart ({{ cartLabel }})</a>
      </div>
    </div>
  </header>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:140},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;shop&quot;,&quot;blessed&quot;,&quot;yatra&quot;,&quot;story&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cartCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { cartLabel: String(this.props.cartCount ?? 0) };
  }
  componentDidMount() {
    const active = this.props.active;
    if (active) {
      const el = document.querySelector('[data-navlink="' + active + '"]');
      if (el) { el.style.borderBottom = "1px solid #17130F"; el.style.color = "#17130F"; }
    }
    const nav = document.querySelector("[data-nav]");
    const inner = document.querySelector("[data-navinner]");
    let ticking = false;
    const onScroll = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        const compact = (window.scrollY || 0) > 60;
        if (inner) { inner.style.paddingTop = compact ? "12px" : "22px"; inner.style.paddingBottom = compact ? "12px" : "22px"; }
        if (nav) { nav.style.background = compact ? "rgba(247,242,233,.97)" : "rgba(247,242,233,.9)"; nav.style.boxShadow = compact ? "0 1px 24px rgba(23,19,15,.07)" : "none"; }
        ticking = false;
      });
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    this._onScroll = onScroll;
    onScroll();
  }
  componentWillUnmount() { if (this._onScroll) window.removeEventListener("scroll", this._onScroll); }
}
</script>
</body>
</html>
